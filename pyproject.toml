[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "vyshkat"
version = "1.0.0"
description = "Учебное консольное приложение учёта парка кикшеринга"
requires-python = ">=3.9"
dependencies = ["dependency-injector==4.48.2"]

[project.scripts]
vyshkat = "vyshkat.main:main"

[tool.setuptools.packages.find]
include = ["vyshkat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=vyshkat --cov-branch --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
